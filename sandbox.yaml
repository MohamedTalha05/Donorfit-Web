# App Engine service for the MFB-Minbar sandbox (static Vite SPA served from dist/)
runtime: python312
service: mfb-donorfit-sandbox

handlers:
  # Hashed build assets (JS/CSS) - safe to cache long
  - url: /assets
    static_dir: dist/assets
    secure: always
    expiration: 30d

  # Other static files at the root of dist/ (favicon, images, etc.)
  - url: /(.*\.(ico|png|jpg|jpeg|gif|svg|webp|json|txt|webmanifest|woff2?))$
    static_files: dist/\1
    upload: dist/.*\.(ico|png|jpg|jpeg|gif|svg|webp|json|txt|webmanifest|woff2?)$
    secure: always

  # SPA fallback - every other route returns index.html
  - url: /.*
    static_files: dist/index.html
    upload: dist/index.html
    secure: always
    expiration: 0s
